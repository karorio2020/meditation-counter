<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eee0c1"><title>Meditation counter</title>
<style>
:root{--paper:#f4e8cf;--cream:#fff8e9;--ink:#62564b;--olive:#89884d;--gold:#c69a55;--line:rgba(166,132,77,.24);--shadow:0 3px 12px rgba(117,88,48,.10)}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Georgia,'Times New Roman',serif;background-color:var(--paper);background-image:radial-gradient(rgba(156,119,65,.10) .7px,transparent .7px),linear-gradient(135deg,#f8eedb,#f0dfbd);background-size:5px 5px,100% 100%;min-height:100vh}.app{width:min(100%,680px);margin:auto;padding:0 14px 36px}.hero{height:190px;margin:0 -14px 14px;position:relative;overflow:hidden;background:#e9d7b2}.hero img{width:100%;height:100%;object-fit:cover;object-position:center 38%;display:block}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 15%,rgba(246,232,204,.12) 55%,rgba(246,232,204,.12))}.hero h1{position:absolute;z-index:2;left:0;right:0;bottom:8px;margin:0;text-align:center;font-size:clamp(25px,7vw,36px);line-height:1.1;font-weight:400;color:#5c574d;text-shadow:0 1px 8px rgba(255,247,226,.85);letter-spacing:.02em}.hero:after{background:linear-gradient(0deg,rgba(246,232,204,.28),transparent 38%)}.ornament{text-align:center;color:var(--gold);font-size:22px;line-height:1;margin:8px 0 14px}.panel{background:rgba(255,249,235,.76);border:1px solid rgba(255,255,255,.9);border-radius:25px;padding:14px 13px 13px;margin:12px 0;box-shadow:var(--shadow);backdrop-filter:blur(3px)}.panel-head{display:flex;align-items:center;gap:10px;padding:0 3px 10px;border-bottom:1px solid var(--line);color:#66705a}.panel-head h2{font-size:27px;font-weight:400;margin:0;letter-spacing:.02em}.head-icon{font-size:27px;color:var(--gold)}.spacer{flex:1}.add{border:1px solid rgba(255,255,255,.95);background:#f6e8ca;color:var(--olive);width:38px;height:38px;border-radius:50%;font:28px/1 Georgia;box-shadow:var(--shadow);cursor:pointer}.timer-row{display:grid;grid-template-columns:minmax(82px,1.25fr) 48px 22px 48px 22px 36px 32px 32px;align-items:center;gap:4px;padding:9px 2px;border-bottom:1px solid var(--line)}.timer-sound{width:100%;min-width:0;border:1px solid #ead8b9;background:#fff6e6;border-radius:12px;padding:8px 3px;color:#65705a;font:14px Georgia;outline:none}.duration{width:100%;min-width:0;text-align:center;border:1px solid #ead8b9;background:#fff6e6;border-radius:12px;padding:8px 2px;color:var(--ink);font:20px Georgia;box-shadow:inset 0 1px 3px #e8d6b8}.unit{font-size:14px;text-align:center}.icon-btn{border:1px solid rgba(255,255,255,.95);background:#fff6e5;color:var(--olive);border-radius:50%;width:36px;height:36px;display:grid;place-items:center;font:20px Arial;box-shadow:var(--shadow);cursor:pointer}.icon-btn.play{background:var(--olive);color:#fff8e8;border:0;width:40px;height:40px;font-size:18px}.icon-btn.active{background:#d9c28f;color:#fff}.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.repeat{font-size:19px}.start-all{display:flex;align-items:center;justify-content:center;gap:13px;width:min(88%,390px);margin:14px auto 1px;padding:13px;border:0;border-radius:40px;background:linear-gradient(110deg,#9b985c,#777942);color:#fff8e8;font:25px Georgia;box-shadow:0 4px 12px rgba(100,94,45,.2);cursor:pointer}.start-all.running{background:#655f40}.counter-row{display:grid;grid-template-columns:minmax(0,1fr) 36px 36px minmax(42px,.7fr) 36px 44px 36px 34px;gap:5px;align-items:center;padding:10px 1px;border-bottom:1px solid var(--line)}.counter-name{width:100%;min-width:0;border:0;background:transparent;color:#68715a;font:16px Georgia;padding:7px 1px;outline:none}.count-value{text-align:center;font-size:32px;line-height:1;color:#66584d;font-variant-numeric:tabular-nums}.step{height:36px;border:1px solid white;background:#fff6e6;color:#8d7b55;border-radius:20px;font:20px Georgia;box-shadow:var(--shadow);cursor:pointer}.step.wide{font-size:16px}.counter-row .play{width:36px;height:36px}.counter-row .trash{width:34px;height:34px}.counter-meta{display:none}.sound-select{border:1px solid #ead8b9;background:#fff6e6;border-radius:20px;padding:8px 12px;color:var(--ink);font:15px Georgia;max-width:100%}.settings{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.setting{min-width:0;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:30px;border:1px solid white;background:rgba(255,249,235,.75);box-shadow:var(--shadow)}.setting label{font-size:14px;white-space:nowrap}.setting select{min-width:0;flex:1}.volume{width:100%;accent-color:var(--olive)}.hint{text-align:center;font:11px Arial;color:#9b8b73;margin:5px 0 0}.running-line{font:12px Arial;color:#77734f;text-align:center;min-height:16px;margin-top:8px}.footer{text-align:center;color:#ad9469;font-size:20px;margin-top:16px}
@media(max-width:430px){.app{padding-left:10px;padding-right:10px}.hero{margin-left:-10px;margin-right:-10px;height:170px}.hero h1{font-size:27px}.panel{padding:12px 9px;border-radius:21px}.timer-row{grid-template-columns:minmax(64px,1fr) 48px 22px 48px 22px 36px 32px 32px;gap:3px}.timer-sound{font-size:12px}.duration{font-size:18px;padding:8px 0}.unit{font-size:12px}.icon-btn{width:31px;height:31px}.icon-btn.play{width:35px;height:35px}.icon-btn svg{width:17px;height:17px}.counter-row{grid-template-columns:minmax(0,1fr) 30px 30px minmax(38px,.7fr) 30px 40px 32px 30px;gap:4px}.counter-name{font-size:14px}.count-value{font-size:28px}.step{height:33px;font-size:18px}.step.wide{font-size:14px}.counter-row .play{width:33px;height:33px}.counter-row .trash{width:30px;height:30px}.settings{gap:7px}.setting{padding:9px 8px;gap:5px}.setting label{font-size:12px}.sound-select{padding:7px 8px;font-size:13px}}
@media(max-width:360px){.timer-row{grid-template-columns:minmax(70px,1fr) 39px 17px 39px 17px 30px 27px 27px}.counter-row{grid-template-columns:minmax(0,1fr) 30px 30px 40px 30px 39px 30px}.counter-name{font-size:12px}}

<section class="panel" aria-labelledby="time-title"><div class="panel-head"><span class="head-icon">◷</span><h2 id="time-title">Time</h2><span class="spacer"></span><button class="add" id="addTimer" aria-label="Add timer">+</button></div><div id="timers"></div><button class="start-all" id="startAll"><span>▶</span> Start All</button><div class="running-line" id="timerStatus"></div></section>
<section class="panel" aria-labelledby="mantra-title"><div class="panel-head"><span class="head-icon">♧</span><h2 id="mantra-title">Mantra</h2><span class="spacer"></span><button class="add" id="addCounter" aria-label="Add counter">+</button></div><div id="counters"></div></section>
<p class="hint">Time and Mantra run independently. Sound is selected for each timer.</p><div class="footer">✧　❀　✧</div>
</main>
<script>
const $=s=>document.querySelector(s);
const soundOptions=[['tingsha','Tingsha'],['bowl','Singing bowl'],['handpan','Handpan'],['rainstick','Rainstick'],['click','Click'],['metronome','Metronome'],['beep','Electronic'],['wood','Wood'],['rain','Rain'],['river','River'],['birds','Birdsong']];
let timers=[{id:1,sound:'tingsha',min:10,sec:0,repeat:false,remaining:null,running:false},{id:2,sound:'bowl',min:20,sec:30,repeat:false,remaining:null,running:false},{id:3,sound:'handpan',min:30,sec:0,repeat:false,remaining:null,running:false}];
let counters=[{id:1,name:'Japa',current:0,running:false},{id:2,name:'Breath',current:0,running:false}];
let nextTimerId=4,nextCounterId=3,loop=null;
const icons={trash:'<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3m-9 0 1 14h10l1-14M10 11v6m4-6v6"/></svg>',repeat:'<svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4m14-1v2a3 3 0 0 1-3 3H3"/></svg>'};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function options(selected){return soundOptions.map(([v,label])=>`<option value="${v}" ${selected===v?'selected':''}>${label}</option>`).join('')}
function render(){
 $('#timers').innerHTML=timers.map(t=>`<div class="timer-row" data-id="${t.id}"><select class="timer-sound" data-field="sound" aria-label="Timer sound">${options(t.sound)}</select><input class="duration" type="number" min="0" max="999" value="${t.min}" data-field="min" aria-label="Minutes"><span class="unit">min</span><input class="duration" type="number" min="0" max="59" value="${t.sec}" data-field="sec" aria-label="Seconds"><span class="unit">sec</span><button class="icon-btn play" data-action="play" aria-label="Start timer">${t.running?'Ⅱ':'▶'}</button><button class="icon-btn repeat ${t.repeat?'active':''}" data-action="repeat" aria-label="Toggle repeat">${icons.repeat}</button><button class="icon-btn" data-action="delete" aria-label="Delete timer">${icons.trash}</button></div>`).join('');
 $('#counters').innerHTML=counters.map(c=>`<div class="counter-row" data-id="${c.id}"><input class="counter-name" aria-label="Counter name" value="${esc(c.name)}" data-field="name"><button class="step wide" data-action="minus10">−10</button><button class="step" data-action="minus">−</button><div class="count-value" aria-label="Current count">${c.current}</div><button class="step" data-action="plus">+</button><button class="step wide" data-action="plus10">+10</button><button class="icon-btn play" data-action="counter" aria-label="Start counter">${c.running?'Ⅱ':'▶'}</button><button class="icon-btn trash" data-action="delete" aria-label="Delete counter">${icons.trash}</button></div>`).join('');
}
let audio=null;
function getAudio(){
 if(!audio){
  const Ctx=window.AudioContext||window.webkitAudioContext;
  if(!Ctx)throw new Error('Web Audio API is not supported in this browser.');
  audio=new Ctx({latencyHint:'interactive'});
 }
 if(audio.state==='suspended') audio.resume().catch(()=>{});
 return audio;
}
async function unlockAudio(){
 try{
  const a=getAudio();
  if(a.state!=='running') await a.resume();
  // A tiny, silent buffer unlocks audio output on iOS Safari after a user gesture.
  const b=a.createBuffer(1,1,a.sampleRate),src=a.createBufferSource();
  src.buffer=b;src.connect(a.destination);src.start();
 }catch(err){console.warn('Audio could not be unlocked:',err)}
}
function tone(freq=440,dur=.12,wave='sine',gain=.12,delay=0){
 let a=getAudio();
 const schedule=()=>{
  if(a.state!=='running')return;
  let o=a.createOscillator(),g=a.createGain(),start=a.currentTime+delay;
  o.type=wave;o.frequency.value=freq;
  g.gain.setValueAtTime(.0001,start);
  g.gain.exponentialRampToValueAtTime(Math.max(.0002,gain),start+.012);
  g.gain.exponentialRampToValueAtTime(.0001,start+dur);
  o.connect(g);g.connect(a.destination);o.start(start);o.stop(start+dur+.02);
 };
 if(a.state==='running')schedule();else a.resume().then(schedule).catch(()=>{});
}
function noise(dur=.4,filter=1000,gain=.05){
 let a=getAudio();
 const schedule=()=>{
  if(a.state!=='running')return;
  let n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  let src=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
  src.buffer=b;f.type='lowpass';f.frequency.value=filter;
  g.gain.setValueAtTime(gain,a.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+dur);
  src.connect(f);f.connect(g);g.connect(a.destination);src.start();
 };
 if(a.state==='running')schedule();else a.resume().then(schedule).catch(()=>{});
}
// Prime/resume audio only in response to a real user gesture (required by Safari/Chrome).
document.addEventListener('pointerdown',unlockAudio,{passive:true});
document.addEventListener('keydown',unlockAudio);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&audio&&audio.state==='suspended')audio.resume().catch(()=>{})});
window.addEventListener('pageshow',()=>{if(audio&&audio.state==='suspended')audio.resume().catch(()=>{})});
function playSound(kind){switch(kind){case'click':tone(1800,.025,'square',.08);break;case'metronome':tone(1050,.045,'square',.08);break;case'beep':tone(880,.1,'sine',.09);break;case'wood':tone(420,.08,'triangle',.12);break;case'tingsha':tone(2400,.8,'sine',.11);tone(3100,.65,'sine',.06,.02);break;case'rainstick':noise(.9,2200,.08);break;case'bowl':tone(220,1.8,'sine',.13);tone(330,1.5,'sine',.06,.02);break;case'handpan':tone(330,.7,'sine',.12);tone(495,.6,'sine',.06,.06);break;case'rain':noise(1.8,1600,.025);break;case'river':noise(1.8,700,.035);break;case'birds':tone(1900,.13,'sine',.045);tone(2400,.16,'sine',.04,.16);tone(2100,.12,'sine',.04,.33);break}}
function ensureLoop(){getAudio();if(!loop)loop=setInterval(tick,1000)}
function tick(){timers.forEach(t=>{if(!t.running)return;t.remaining--;if(t.remaining<=0){playSound(t.sound);if(t.repeat)t.remaining=Math.max(1,t.min*60+t.sec);else t.running=false}});counters.forEach(c=>{if(!c.running)return;c.current++;playSound('click')});render();if(!timers.some(t=>t.running)&&!counters.some(c=>c.running)){clearInterval(loop);loop=null;$('#startAll').classList.remove('running')}}
function beginTimer(t){t.remaining=Math.max(1,(Number(t.min)||0)*60+(Number(t.sec)||0));t.running=true;ensureLoop();render()}
function beginCounter(c){if(c.target<=0)return;c.current=0;c.running=true;ensureLoop();render()}
function startAllTimers(){if(timers.some(t=>t.running)){timers.forEach(t=>t.running=false);if(!counters.some(c=>c.running)){clearInterval(loop);loop=null}$('#startAll').classList.remove('running');render();return}timers.forEach(t=>{t.remaining=Math.max(1,(Number(t.min)||0)*60+(Number(t.sec)||0));t.running=true});ensureLoop();$('#startAll').classList.add('running');render()}
$('#timers').addEventListener('change',e=>{let row=e.target.closest('.timer-row');if(!row)return;let t=timers.find(x=>x.id==row.dataset.id);if(!t)return;let f=e.target.dataset.field;if(f==='sound')t.sound=e.target.value;if(f==='min')t.min=Math.max(0,Math.min(999,Number(e.target.value)||0));if(f==='sec')t.sec=Math.max(0,Math.min(59,Number(e.target.value)||0))});
$('#timers').addEventListener('click',e=>{let b=e.target.closest('button[data-action]');if(!b)return;let row=b.closest('.timer-row'),t=timers.find(x=>x.id==row.dataset.id);if(b.dataset.action==='delete'){timers=timers.filter(x=>x!==t);render()}if(b.dataset.action==='repeat'){t.repeat=!t.repeat;render()}if(b.dataset.action==='play'){t.running?(t.running=false,render()):beginTimer(t)}});
$('#counters').addEventListener('change',e=>{let row=e.target.closest('.counter-row');if(!row)return;let c=counters.find(x=>x.id==row.dataset.id);if(e.target.dataset.field==='name')c.name=e.target.value});
$('#counters').addEventListener('click',e=>{let b=e.target.closest('button[data-action]');if(!b)return;let row=b.closest('.counter-row'),c=counters.find(x=>x.id==row.dataset.id);switch(b.dataset.action){case'delete':counters=counters.filter(x=>x!==c);render();break;case'minus10':c.current=Math.max(0,c.current-10);render();break;case'minus':c.current=Math.max(0,c.current-1);render();break;case'plus':c.current++;render();break;case'plus10':c.current+=10;render();break;case'counter':c.running?(c.running=false,render()):beginCounter(c);break}});
$('#addTimer').onclick=()=>{timers.push({id:nextTimerId++,sound:'tingsha',min:5,sec:0,repeat:false,remaining:null,running:false});render()};
$('#addCounter').onclick=()=>{counters.push({id:nextCounterId++,name:'Mantra '+nextCounterId,current:0,running:false});render()};
$('#startAll').onclick=()=>{unlockAudio();startAllTimers()};render();
</script></body></html>
